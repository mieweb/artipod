version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      prod-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Peer deps: a major bump changes what consumers must install — decide by hand.
      - dependency-name: dockerode
        update-types: [version-update:semver-major]
      - dependency-name: "@zenfs/*"
        update-types: [version-update:semver-major]
      - dependency-name: just-bash
        update-types: [version-update:semver-major]
      - dependency-name: diff
        update-types: [version-update:semver-major]
      - dependency-name: fflate
        update-types: [version-update:semver-major]
      - dependency-name: isomorphic-git
        update-types: [version-update:semver-major]

  # CLI shim: its @artipod/core pin is bumped by the release process, not Dependabot.
  - package-ecosystem: npm
    directory: /packages/artipod
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "@artipod/core"

  - package-ecosystem: npm
    directory: /examples/artipod-spa
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      all-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /examples/mcp-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      all-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
