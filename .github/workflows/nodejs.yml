name: Node.js CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # authenticate coverage uploads without a stored token

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v7
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Lint
      run: npm run lint
    
    - name: Build
      run: npm run build
    
    - name: Test
      run: npm test
    
    - name: Test Coverage
      run: npm run test:coverage
    
    # Keep coverage available even when the external reporting service is down.
    - name: Save coverage report
      uses: actions/upload-artifact@v7
      if: matrix.node-version == '20.x'
      with:
        name: core-coverage
        path: coverage/lcov.info
        if-no-files-found: error
        retention-days: 14

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      if: matrix.node-version == '20.x'
      # Coverage reporting is advisory, including uploader startup/network errors.
      continue-on-error: true
      with:
        use_oidc: true
        # Use the official PyPI distribution while cli.codecov.io's download
        # endpoint fails TLS handshakes on GitHub-hosted runners.
        use_pypi: true
        version: v11.3.1
        files: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  spa-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/artipod-spa

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js 20.x
      uses: actions/setup-node@v7
      with:
        node-version: 20.x

    # file:../.. runs the core's prepare (tsc) — its devDeps must exist first
    - name: Install core dependencies
      run: npm ci
      working-directory: .

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Typecheck
      run: npm run typecheck

    - name: Test
      run: npx vitest run

    # export:static carries the struct-minify + baked-version assertions
    - name: Static export (with assertions)
      run: npm run export:static

  browser-storage:
    name: Encrypted browser storage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: npm
        cache-dependency-path: |
          package-lock.json
          examples/artipod-spa/package-lock.json

    - name: Install core and SPA dependencies
      run: |
        npm ci
        npm ci --prefix examples/artipod-spa

    - name: Build the browser app
      run: npm run build:ui

    - name: Install the pinned browser test runtime
      run: |
        npm install --prefix "$RUNNER_TEMP/artipod-browser-tests" --no-save --package-lock=false playwright@1.62.1
        "$RUNNER_TEMP/artipod-browser-tests/node_modules/.bin/playwright" install --with-deps chromium

    - name: Verify encrypted storage and migration in Chromium
      env:
        PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/artipod-browser-tests/node_modules/playwright
        BASE_URL: http://127.0.0.1:2786
      run: |
        probe_dir=$(mktemp -d "$RUNNER_TEMP/artipod-browser-data.XXXXXX")
        ARTIPOD_UI_DIR="$PWD/dist-ui" node dist/cli.js serve --port 2786 \
          --store "$probe_dir/store" --authority "$probe_dir/authority" --encrypt --no-exec \
          > "$RUNNER_TEMP/artipod-browser-server.log" 2>&1 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true' EXIT
        for attempt in $(seq 1 40); do
          if curl --fail --silent --max-time 2 "$BASE_URL/api/keys" > /dev/null; then break; fi
          sleep 0.5
        done
        curl --fail --silent --max-time 2 "$BASE_URL/api/keys" > /dev/null || { cat "$RUNNER_TEMP/artipod-browser-server.log"; exit 1; }
        node examples/artipod-spa/scripts/verify-vault-migration.mjs
        node examples/artipod-spa/scripts/verify-encrypted-interruption.mjs
        TEST_STORAGE_BACKEND=opfs node examples/artipod-spa/scripts/verify-encrypted-storage.mjs
        TEST_STORAGE_BACKEND=indexeddb node examples/artipod-spa/scripts/verify-encrypted-storage.mjs

    - name: Save browser server diagnostics
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: encrypted-browser-server-log
        path: ${{ runner.temp }}/artipod-browser-server.log
        if-no-files-found: ignore

  storage-consumer:
    name: Packed public storage consumer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: npm
    - run: npm ci
    - name: Install the pinned browser test runtime
      run: |
        npm install --prefix "$RUNNER_TEMP/artipod-storage-tests" --no-save --package-lock=false playwright@1.62.1
        "$RUNNER_TEMP/artipod-storage-tests/node_modules/.bin/playwright" install --with-deps chromium
    - name: Verify the published package in Node and Chromium
      env:
        PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/artipod-storage-tests/node_modules/playwright
      run: npm run test:storage-consumer
