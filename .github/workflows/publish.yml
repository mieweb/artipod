name: Publish to npm

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      NODE_AUTH_TOKEN: ""
      NPM_TOKEN: ""
      NPM_CONFIG_USERCONFIG: ""

    steps:
      - name: Identify token source
        run: |
          echo "NODE_AUTH_TOKEN present at job start"
          echo "Value length: ${#NODE_AUTH_TOKEN}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""

      - name: Install dependencies
        run: npm ci

      #- name: Run tests
      #  run: npm test

      - name: Build
        run: npm run build

      # --- New debug + cleanup step ---
      - name: Inspect and remove temporary .npmrc
        run: |
          echo "Checking for _temp/.npmrc..."
          if [ -f /home/runner/work/_temp/.npmrc ]; then
            echo "_temp/.npmrc exists! Contents:"
            cat /home/runner/work/_temp/.npmrc
            rm -f /home/runner/work/_temp/.npmrc
            echo "Removed _temp/.npmrc"
          else
            echo "_temp/.npmrc does not exist"
          fi

      - name: Verify npm env is clean
        run: env | grep -E 'NPM|NODE_AUTH' || echo "No npm env vars"

      - name: Publish to npm
        run: npm publish --access public
