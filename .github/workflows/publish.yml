name: Publish to npm

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags: buildinfo.mjs bakes the version/commit into dist

      - name: Setup Node.js 20 for build
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle the browser UI (dist-ui — npx artipod serve is batteries-included)
        run: |
          cd examples/artipod-spa && npm ci && cd ../..
          npm run build:ui

      - name: Setup Node.js 24 for publish
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm # trusted publishing (OIDC) needs npm >= 11.5.1
        run: npm install -g npm@latest

      - name: Publish @artipod/core to npm
        run: |
          V=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "@artipod/core@$V" version 2>/dev/null)" ]; then
            echo "@artipod/core@$V already on the registry — skipping"
          else
            npm publish --access public
          fi

      - name: Publish artipod (CLI alias) to npm
        working-directory: packages/artipod
        run: |
          V=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "artipod@$V" version 2>/dev/null)" ]; then
            echo "artipod@$V already on the registry — skipping"
          else
            npm publish --access public
          fi
